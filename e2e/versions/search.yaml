# Elasticsearch's and OpenSearch's older releases: see scripts/versions.sh. Elasticsearch with
# its security on (the e2e one's password, a trial license for field security, which the agent
# login uses) over plain HTTP; OpenSearch without its security plugin, as the e2e one. 7.10 and
# OpenSearch 1.3 are below the floor (7.17, 2.x); the agent login needs 7.17, so on 7.10 only
# its refusal is tested (tests/versions/search.rs), not live_agent_login. The other engines' addresses point nowhere, so
# the shared suites skip them instead of reaching the e2e servers.
name: dataman-versions

x-es: &es
  environment:
    discovery.type: single-node
    xpack.security.enabled: "true"
    xpack.security.http.ssl.enabled: "false"
    xpack.license.self_generated.type: trial
    ELASTIC_PASSWORD: dataman
    ES_JAVA_OPTS: -Xms512m -Xmx512m
  # It runs as 1000, and a tmpfs is root's.
  tmpfs: ["/usr/share/elasticsearch/data:uid=1000,gid=0"]
  healthcheck:
    test: curl -fsu elastic:dataman 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s'
    interval: 3s
    retries: 100

x-os: &os
  environment:
    discovery.type: single-node
    DISABLE_SECURITY_PLUGIN: "true"
    DISABLE_INSTALL_DEMO_CONFIG: "true"
    OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
  tmpfs: ["/usr/share/opensearch/data:uid=1000,gid=1000"]
  healthcheck:
    test: curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s'
    interval: 3s
    retries: 100

x-tests: &tests live_versions live_search live_nosql_battery live_nosql_guard live_agent_login

services:
  es-7-10:
    <<: *es
    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.2
    ports: ["127.0.0.1:9210:9200"]
    labels:
      dataman.url: http://elastic:dataman@127.0.0.1:9210
      dataman.expect: Elasticsearch 7.10.
      dataman.env: DATAMAN_ES=127.0.0.1:9210 DATAMAN_OPENSEARCH=127.0.0.1:1 DATAMAN_MONGO=127.0.0.1:1 DATAMAN_REDIS=127.0.0.1:1
      dataman.tests: live_versions live_search live_nosql_battery live_nosql_guard

  es-7-17:
    <<: *es
    image: elasticsearch:7.17.28
    ports: ["127.0.0.1:9217:9200"]
    labels:
      dataman.url: http://elastic:dataman@127.0.0.1:9217
      dataman.expect: Elasticsearch 7.17.
      dataman.env: DATAMAN_ES=127.0.0.1:9217 DATAMAN_AGENT_LOGIN_LIVE=1 DATAMAN_AU_ES=127.0.0.1:9217 DATAMAN_AU_ES_PASSWORD=dataman DATAMAN_OPENSEARCH=127.0.0.1:1 DATAMAN_MONGO=127.0.0.1:1 DATAMAN_REDIS=127.0.0.1:1 DATAMAN_AU_PG=127.0.0.1:1 DATAMAN_AU_MYSQL=127.0.0.1:1 DATAMAN_AU_MSSQL=127.0.0.1:1 DATAMAN_AU_MONGO=127.0.0.1:1 DATAMAN_AU_REDIS=127.0.0.1:1 DATAMAN_AU_OS=127.0.0.1:1
      dataman.tests: *tests

  es-8-19:
    <<: *es
    image: elasticsearch:8.19.25
    ports: ["127.0.0.1:9219:9200"]
    labels:
      dataman.url: http://elastic:dataman@127.0.0.1:9219
      dataman.expect: Elasticsearch 8.19.
      dataman.env: DATAMAN_ES=127.0.0.1:9219 DATAMAN_AGENT_LOGIN_LIVE=1 DATAMAN_AU_ES=127.0.0.1:9219 DATAMAN_AU_ES_PASSWORD=dataman DATAMAN_OPENSEARCH=127.0.0.1:1 DATAMAN_MONGO=127.0.0.1:1 DATAMAN_REDIS=127.0.0.1:1 DATAMAN_AU_PG=127.0.0.1:1 DATAMAN_AU_MYSQL=127.0.0.1:1 DATAMAN_AU_MSSQL=127.0.0.1:1 DATAMAN_AU_MONGO=127.0.0.1:1 DATAMAN_AU_REDIS=127.0.0.1:1 DATAMAN_AU_OS=127.0.0.1:1
      dataman.tests: *tests

  es-9:
    <<: *es
    image: elasticsearch:9.5.5
    ports: ["127.0.0.1:9290:9200"]
    labels:
      dataman.url: http://elastic:dataman@127.0.0.1:9290
      dataman.expect: Elasticsearch 9.
      dataman.env: DATAMAN_ES=127.0.0.1:9290 DATAMAN_AGENT_LOGIN_LIVE=1 DATAMAN_AU_ES=127.0.0.1:9290 DATAMAN_AU_ES_PASSWORD=dataman DATAMAN_OPENSEARCH=127.0.0.1:1 DATAMAN_MONGO=127.0.0.1:1 DATAMAN_REDIS=127.0.0.1:1 DATAMAN_AU_PG=127.0.0.1:1 DATAMAN_AU_MYSQL=127.0.0.1:1 DATAMAN_AU_MSSQL=127.0.0.1:1 DATAMAN_AU_MONGO=127.0.0.1:1 DATAMAN_AU_REDIS=127.0.0.1:1 DATAMAN_AU_OS=127.0.0.1:1
      dataman.tests: *tests

  os-1-3:
    <<: *os
    image: opensearchproject/opensearch:1.3.20
    ports: ["127.0.0.1:9231:9200"]
    labels:
      dataman.url: http://127.0.0.1:9231
      dataman.expect: OpenSearch 1.3.
      dataman.env: DATAMAN_OPENSEARCH=127.0.0.1:9231 DATAMAN_ES=127.0.0.1:1 DATAMAN_MONGO=127.0.0.1:1 DATAMAN_REDIS=127.0.0.1:1
      dataman.tests: live_versions live_search live_nosql_battery live_nosql_guard

  os-2:
    <<: *os
    image: opensearchproject/opensearch:2.11.1
    ports: ["127.0.0.1:9232:9200"]
    labels:
      dataman.url: http://127.0.0.1:9232
      dataman.expect: OpenSearch 2.11.
      dataman.env: DATAMAN_OPENSEARCH=127.0.0.1:9232 DATAMAN_ES=127.0.0.1:1 DATAMAN_MONGO=127.0.0.1:1 DATAMAN_REDIS=127.0.0.1:1
      dataman.tests: live_versions live_search live_nosql_battery live_nosql_guard

  os-3:
    <<: *os
    image: opensearchproject/opensearch:3.9.0
    ports: ["127.0.0.1:9233:9200"]
    labels:
      dataman.url: http://127.0.0.1:9233
      dataman.expect: OpenSearch 3.
      dataman.env: DATAMAN_OPENSEARCH=127.0.0.1:9233 DATAMAN_ES=127.0.0.1:1 DATAMAN_MONGO=127.0.0.1:1 DATAMAN_REDIS=127.0.0.1:1
      dataman.tests: live_versions live_search live_nosql_battery live_nosql_guard
