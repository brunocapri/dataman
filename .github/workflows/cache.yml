name: Cache

# The caches the Linux, Windows and macOS workflows start from, saved on main: a cache saved by a tag or a
# pull request is theirs alone, and main's is the one every run can read. Two per platform:
#   - the Rust cache (Swatinem/rust-cache, shared-key linux-x86_64 / windows-x86_64 / macos-aarch64): what the
#     tests, the check stages and the packages build, minus the workspace's own crates;
#   - the DuckDB engine (target/duckdb), keyed on engines/duckdb and scripts/duckdb-engine.sh:
#     its C++ takes 10+ minutes, and only those files change it.
# Together about 8 GB of the repository's 10. linux.yml, windows.yml and macos.yml only read them.
#
# A run builds only what is missing: a Cargo.lock or toolchain already cached skips the Rust
# build, an engine already cached skips DuckDB. The weekly run keeps them read: GitHub drops a
# cache no one read for 7 days.
on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - rust-toolchain.toml
      - "**/Cargo.toml"
      - vendor/**
      - engines/duckdb/**
      - scripts/duckdb-engine.sh
      - .github/workflows/cache.yml
      - .github/workflows/linux.yml
      - .github/workflows/windows.yml
      - .github/workflows/macos.yml
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true

# The Rust cache's key hashes the CARGO*/RUST* variables: these are linux.yml's and windows.yml's,
# exactly (Windows adds its own below, as windows.yml does).
env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux (x86_64)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # linux.yml's.
      DEPS: >-
        libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
        libfontconfig-dev libfreetype-dev libegl1 libgl1-mesa-dri
        xvfb xauth x11-utils dbus-x11 gnome-keyring libsecret-tools postgresql-client
        dpkg-dev file
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && xargs sudo apt-get install -y --no-install-recommends <<< "$DEPS"
      - name: Rust, from rust-toolchain.toml
        run: rustup set profile minimal && rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
        id: rust
        with:
          shared-key: linux-x86_64
      - name: The DuckDB engine, cached
        id: duckdb
        uses: actions/cache@v4
        with:
          path: target/duckdb
          key: duckdb-${{ runner.os }}-x86_64-${{ hashFiles('rust-toolchain.toml', 'engines/duckdb/**', 'scripts/duckdb-engine.sh') }}
      - name: The DuckDB engine
        if: steps.duckdb.outputs.cache-hit != 'true'
        run: scripts/duckdb-engine.sh
      # What linux.yml builds: the check, the tests, the app for the check stages, xtask, and the
      # package's app (scripts/linux/build.sh).
      - name: The builds linux.yml makes
        if: steps.rust.outputs.cache-hit != 'true'
        run: |
          cargo check --release --workspace --all-targets --features dataman/checks
          cargo test --release --workspace --no-run $(scripts/fast-tests.sh)
          cargo build --release -p dataman -p dataman-mcp --features dataman/checks
          cargo build --release -p xtask
          cargo build --release --locked -p dataman
      # The engine's own build has its cache above: kept out of the Rust one.
      - run: rm -rf target/duckdb-engine

  macos:
    name: macos (aarch64)
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Rust, from rust-toolchain.toml
        run: rustup set profile minimal && rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
        id: rust
        with:
          shared-key: macos-aarch64
      - name: The DuckDB engine, cached
        id: duckdb
        uses: actions/cache@v4
        with:
          path: target/duckdb
          key: duckdb-${{ runner.os }}-aarch64-${{ hashFiles('rust-toolchain.toml', 'engines/duckdb/**', 'scripts/duckdb-engine.sh') }}
      - name: The DuckDB engine
        if: steps.duckdb.outputs.cache-hit != 'true'
        run: scripts/duckdb-engine.sh
      # What macos.yml builds: the check, the tests, the app for the check stages, and xtask.
      - name: The builds macos.yml makes
        if: steps.rust.outputs.cache-hit != 'true'
        run: |
          cargo check --release --workspace --all-targets --features dataman/checks
          cargo test --release --workspace --no-run $(scripts/fast-tests.sh)
          cargo build --release -p dataman -p dataman-mcp --features dataman/checks
          cargo build --release -p xtask
      # The engine's own build has its cache above: kept out of the Rust one.
      - run: rm -rf target/duckdb-engine

  windows:
    name: windows (x86_64)
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Rust, from rust-toolchain.toml
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
        id: rust
        with:
          shared-key: windows-x86_64
      - name: The DuckDB engine, cached
        id: duckdb
        uses: actions/cache@v4
        with:
          path: target/duckdb
          key: duckdb-${{ runner.os }}-x86_64-${{ hashFiles('rust-toolchain.toml', 'engines/duckdb/**', 'scripts/duckdb-engine.sh') }}
      - name: The DuckDB engine
        if: steps.duckdb.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/duckdb-engine.sh
      # What windows.yml builds: the check, the tests, the app for the check stages, xtask, and the
      # package's binaries (scripts/windows/package.ps1).
      - name: The builds windows.yml makes
        if: steps.rust.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo check --release --workspace --all-targets --features dataman/checks
          cargo test --release --workspace --no-run $(scripts/fast-tests.sh)
          cargo build --release -p dataman -p dataman-mcp --features dataman/checks
          cargo build --release -p xtask
          cargo build --release -p dataman -p dataman-mcp
      - name: The engine's own build has its cache above, kept out of the Rust one
        shell: bash
        run: rm -rf target/duckdb-engine
