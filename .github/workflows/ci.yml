# The fast gate: one release build of the whole workspace's tests (the checks included; e2e.yml
# restores the same cache), then every test binary. x86_64 Linux; on main also the release builds
# (Linux packages on both architectures, the Mac app), which keep release.yml's caches warm.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.99.0"
  # One selection for the build and every test run: nothing builds twice.
  SEL: --release --locked --workspace --features dataman/checks
  DEPS: >-
    libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
    libfontconfig-dev libfreetype-dev libegl1 libgl1-mesa-dri dbus-x11 gnome-keyring

jobs:
  test:
    name: build and test (x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update -qq && xargs sudo apt-get install -y -qq --no-install-recommends <<< "$DEPS"
      - name: Rust ${{ env.RUST_TOOLCHAIN }} only
        # The image's own stable would change the cache key whenever the image updates.
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain list | cut -d' ' -f1 | grep -v "^$RUST_TOOLCHAIN" | xargs -r -n1 rustup toolchain uninstall
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x86_64
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build every test (no new warnings)
        env:
          CARGO_TERM_COLOR: never
        # (The test builds only: the app's own binary, a second compile of its biggest crate, is
        # e2e.yml's and the release's.)
        run: |
          set -o pipefail
          cargo test $SEL --no-run 2>&1 | tee build.log
          # The two `unused Result` warnings in the live sweeps are known; anything else fails.
          known="unused \`Result\`"
          n=$(grep -c "^warning: $known" build.log || true)
          others=$(grep '^warning' build.log | grep -v "$known\\|generated [0-9]* warning\\|future version of Rust" || true)
          [ -z "$others" ] || { echo "::error::new warnings"; echo "$others"; exit 1; }
          [ "$n" -le 2 ]
      - name: Tests, with a Secret Service for the password store
        # The live_* tests need the e2e databases: here none answers and each says
        # "skipping: cannot reach …" (they run against the databases in e2e.yml).
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            cargo test $SEL --no-fail-fast
            cargo test $SEL --test keychain -- --ignored'

  # Main only: the release builds, so a tag's release.yml restores warm caches (a tag sees the
  # caches made on main).
  package:
    name: package (${{ matrix.arch }})
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x86_64 }
          - { os: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update -qq && xargs sudo apt-get install -y -qq --no-install-recommends <<< "$DEPS file imagemagick dpkg-dev"
      - name: Rust ${{ env.RUST_TOOLCHAIN }} only
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain list | cut -d' ' -f1 | grep -v "^$RUST_TOOLCHAIN" | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: package-${{ matrix.arch }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: AppImage and .deb
        run: scripts/linux/build.sh ${{ matrix.arch }}
      - name: The AppImage and the .deb start
        run: |
          img=$(ls dist/linux/*.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 "$img" --version
          APPIMAGE_EXTRACT_AND_RUN=1 "$img" --mcp --version
          sudo apt-get install -y -qq ./dist/linux/*.deb && dataman --version

  macos:
    name: macOS app (universal)
    if: github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust ${{ env.RUST_TOOLCHAIN }} only
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain list | cut -d' ' -f1 | grep -v "^$RUST_TOOLCHAIN" | xargs -n1 rustup toolchain uninstall || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-universal
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build both architectures
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p dataman --target "$t"
          done
