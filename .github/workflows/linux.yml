name: Linux

# x86_64 only. A pull request runs all of it, so a bug shows before the merge; a release takes its
# packages from the tag's run (scripts/github-release.sh). The builds start from what cache.yml saved
# on main: the Rust cache (read only here) and the DuckDB engine. Tests and packages run side by side.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

# The newest push cancels the run under way; a tag's run goes to the end.
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  # No GPU on the runners: Mesa's GL (llvmpipe) draws; its Vulkan driver presents black under Xvfb.
  VK_ICD_FILENAMES: /nonexistent.json
  DEPS: >-
    libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
    libfontconfig-dev libfreetype-dev libegl1 libgl1-mesa-dri
    xvfb xauth x11-utils dbus-x11 gnome-keyring libsecret-tools postgresql-client
    dpkg-dev file

jobs:
  test:
    name: test (x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: sudo apt-get update && xargs sudo apt-get install -y --no-install-recommends <<< "$DEPS"
      - name: Rust, from rust-toolchain.toml
        run: rustup set profile minimal && rustup toolchain install && rustc --version
      # cache.yml saves this cache on main; here it is only read (a tag's or a PR's cache is
      # theirs alone, and would only crowd the repository's 10 GB out).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x86_64
          save-if: false
      - name: Check (no new warnings)
        run: |
          cargo check --release --workspace --all-targets --features dataman/checks 2>&1 | tee check.log
          # The two `unused Result` warnings in the live sweeps are known; anything else fails.
          known="unused \`Result\`"
          n=$(grep -c "^warning: $known" check.log || true)
          others=$(grep '^warning' check.log | grep -v "$known\\|generated [0-9]* warning\\|future version of Rust" || true)
          [ -z "$others" ] || { echo "$others"; exit 1; }
          [ "$n" -le 2 ]
      - name: The DuckDB engine, cached
        id: duckdb
        uses: actions/cache/restore@v6
        with:
          path: target/duckdb
          key: duckdb-${{ runner.os }}-x86_64-${{ hashFiles('rust-toolchain.toml', 'engines/duckdb/**', 'scripts/duckdb-engine.sh') }}
      - name: The DuckDB engine
        run: scripts/duckdb-engine.sh
        env:
          DATAMAN_DUCKDB_CACHED: ${{ steps.duckdb.outputs.cache-hit }}
      # What is selected of the ClickHouse tests skips without a server, and would pass untested:
      # this one is up for them, and DATAMAN_LIVE_REQUIRED makes its absence a failure. The
      # end-to-end stage below reuses it.
      - name: ClickHouse for its live tests
        run: docker compose -f e2e/compose.yaml up -d --wait clickhouse
      - name: Tests, with a Secret Service for the password store
        env:
          DATAMAN_LIVE_REQUIRED: clickhouse
        run: |
          # -e: a failing `cargo test` fails the step, not only the last command.
          # --workspace on both: `-p dataman-core` has other features, and builds it all again.
          dbus-run-session -- bash -ec "
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            cargo test --release --workspace $(scripts/fast-tests.sh)
            cargo test --release --workspace --test keychain -- --ignored"
      - name: End-to-end under Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            cargo run --release -p xtask -- e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-x86_64
          path: target/e2e/
          if-no-files-found: ignore

  package:
    name: package (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: sudo apt-get update && xargs sudo apt-get install -y --no-install-recommends <<< "$DEPS"
      - name: Rust, from rust-toolchain.toml
        run: rustup set profile minimal && rustup toolchain install && rustc --version
      # The test job's cache: the same dependencies, built the same way.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x86_64
          save-if: false
      - name: The DuckDB engine, cached
        id: duckdb
        uses: actions/cache/restore@v6
        with:
          path: target/duckdb
          key: duckdb-${{ runner.os }}-x86_64-${{ hashFiles('rust-toolchain.toml', 'engines/duckdb/**', 'scripts/duckdb-engine.sh') }}
      - name: AppImage and .deb
        run: scripts/linux/build.sh x86_64
        env:
          DATAMAN_DUCKDB_CACHED: ${{ steps.duckdb.outputs.cache-hit }}
      - name: The AppImage starts
        run: |
          img=$(ls dist/linux/*.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 "$img" --version
          APPIMAGE_EXTRACT_AND_RUN=1 "$img" --mcp --version
          sudo apt-get install -y ./dist/linux/*.deb && dataman --version
      - uses: actions/upload-artifact@v7
        with:
          name: dataman-linux-x86_64
          path: dist/linux/
