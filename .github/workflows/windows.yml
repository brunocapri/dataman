name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A run takes over an hour: the one under way finishes, the newest push waits its turn.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.0"
  # The zed checkout (GPUI) has paths longer than MAX_PATH.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  windows:
    name: windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x86_64, experimental: false }
          # Not blocking: the ARM runner is newer and slower to get.
          - { os: windows-11-arm, arch: aarch64, experimental: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      # Long paths for the zed checkout; UTC as on the Linux runners (the tests print times).
      - run: |
          git config --global core.longpaths true
          tzutil /s "UTC"
      - uses: actions/checkout@v4
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
          # A red run still leaves its dependencies built for the next one.
          cache-on-failure: true
      - name: Check (no new warnings)
        shell: bash
        run: |
          cargo check --release --workspace --all-targets --features dataman/checks --color never --message-format short 2>&1 | tee check.log
          test "${PIPESTATUS[0]}" -eq 0
          # Known: the vendored tiberius (its SSPI code is unused) and the two `unused Result`s
          # in the live sweeps. Anything else fails.
          others=$(grep ': warning: ' check.log | grep -v '^vendor[/\\]tiberius' | grep -v 'live_\(pg\|mysql\)_sweep.rs.*unused `Result`' | sort -u || true)
          [ -z "$others" ] || { echo "new warnings:"; echo "$others"; exit 1; }
      - name: Tests, the Credential Manager's too
        run: |
          cargo test --release --workspace --no-fail-fast
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # --workspace: the same features as above, so nothing builds again.
          cargo test --release --workspace --test keychain -- --ignored
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Package (.zip and installer)
        run: scripts\windows\package.ps1
      - name: The app starts and draws
        run: scripts\windows\smoke.ps1
      - name: The installer installs, the installed app starts
        run: |
          $setup = (Get-ChildItem dist\windows\*-setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP "Dataman"
          Start-Process -Wait -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$dir"
          Get-ChildItem $dir
          & "$dir\dataman-mcp.exe" --version
          scripts\windows\smoke.ps1 -Exe "$dir\dataman.exe"
          Start-Process -Wait -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          if (Test-Path "$dir\dataman.exe") { throw "the uninstaller left dataman.exe" }
      - name: MCP over stdio
        run: scripts\windows\mcp-smoke.ps1
      # The runner's desktop as a workstation's: 1024x768 clamps the 1400x900 window the checks
      # lay out for (Linux runs them on a 1600x1000 Xvfb screen), and Windows Server runs with
      # animation effects off, which the app honours (Reduce motion).
      - name: Desktop for the check stages
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch {
            Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices;
          public static class Display {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)] public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra; public int dmFields, dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels; public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency, dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight; }
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern bool EnumDisplaySettings(string d, int m, ref DEVMODE dm);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int ChangeDisplaySettings(ref DEVMODE dm, int f);
            public static int Set(int w, int h) { var dm = new DEVMODE(); dm.dmSize = (short)Marshal.SizeOf(dm); EnumDisplaySettings(null, -1, ref dm); dm.dmPelsWidth = w; dm.dmPelsHeight = h; dm.dmFields = 0x80000 | 0x100000; return ChangeDisplaySettings(ref dm, 0); }
          }
          "@
            Write-Host "ChangeDisplaySettings: $([Display]::Set(1920, 1080))"
          }
          Add-Type -AssemblyName System.Windows.Forms
          $screen = [System.Windows.Forms.SystemInformation]::PrimaryMonitorSize
          Write-Host "screen: $screen"
          # The real pointer out of the way: over the window it would hover and move things the
          # checks drive with their own events (Xvfb has no pointer to get in the way).
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point(($screen.Width - 1), ($screen.Height - 1))
          Add-Type -Namespace W -Name U -MemberDefinition '[DllImport("user32.dll")] public static extern bool SystemParametersInfo(uint a, uint b, IntPtr c, uint d);'
          # SPI_SETCLIENTAREAANIMATION, on, SPIF_UPDATEINIFILE | SPIF_SENDCHANGE
          if (-not [W.U]::SystemParametersInfo(0x1043, 0, [IntPtr]1, 3)) { throw "SystemParametersInfo failed" }
      - name: End-to-end (the stages without a database server)
        run: |
          cargo run --release -p xtask -- e2e --no-compose --only sqlite-check,duckdb-check,project-check,outside-check
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # The runner's own PostgreSQL in place of the compose container: the stages that need
      # nothing else. Not blocking yet: their results are a report.
      - name: End-to-end on PostgreSQL (report)
        if: matrix.arch == 'x86_64' && !cancelled()
        continue-on-error: true
        run: |
          $svc = Get-Service -Name "postgresql*" | Select-Object -First 1
          Set-Service $svc.Name -StartupType Manual
          Start-Service $svc.Name
          $psql = Join-Path $env:PGBIN "psql.exe"
          $env:PGPASSWORD = "root"
          & $psql -h 127.0.0.1 -U postgres -c "ALTER USER postgres PASSWORD 'dataman'"
          $env:PGPASSWORD = "dataman"
          & $psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE dataman"
          $env:DATAMAN_E2E_PSQL = $psql
          $env:DATAMAN_E2E_PG_PORT = "5432"
          $stages = "conns-check,ui-check,split-check,session-check,dock-check,pin-check,history-check,dropdowns-check,folders-check,undo-check,explorer-folders-check,fk-check,fk-pop-check,fk-nav-check,find-check,results-check,value-check,table-check,edit-check,tx-check,intel-check,plan-check,activity-check,input-check,export-check,import-check,settings-check,welcome-check,palette-check,mcp-check,agents-check"
          cargo run --release -p xtask -- e2e --no-compose --no-build --only $stages
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.arch }}
          path: dist/windows/screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.arch }}
          path: target/e2e/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: dataman-windows-${{ matrix.arch }}
          path: |
            dist/windows/*.zip
            dist/windows/*-setup.exe
