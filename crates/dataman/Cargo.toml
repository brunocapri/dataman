[package]
name = "dataman"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
gpui.workspace = true
dataman-core.workspace = true
dataman-mcp.workspace = true
futures-util.workspace = true
gpui_platform.workspace = true
tokio.workspace = true
tokio-postgres = { workspace = true, optional = true }
serde_json.workspace = true
chrono.workspace = true
log = "0.4"
unicode-segmentation = "1"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

# objc2: GPUI does not read macOS's Reduce motion switch.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
raw-window-handle = "0.6"

# The same crate and features GPUI's Linux platform builds.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

# The title bar's move loop, the animation switch, a console for `--version` and `--mcp`.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# The icon and version in the Windows exe.

[build-dependencies]
embed-resource = "3"

[[example]]
name = "editor_demo"
required-features = ["checks"]

[features]
# Test builds only.
# The check stages and benchmarks (`--demo`, `--bench-*`): `xtask e2e` builds with it.
checks = ["dep:tokio-postgres"]
screenshots = ["checks", "gpui/test-support", "gpui_platform/test-support", "dep:image"]
