[package]
name = "dataman"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
gpui.workspace = true
dataman-core.workspace = true
# The MCP server's hub, serving `dataman-mcp`'s calls through the app's socket.
dataman-mcp.workspace = true
futures-util.workspace = true
gpui_platform.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
serde_json.workspace = true
chrono.workspace = true
log = "0.4"
unicode-segmentation = "1"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

# The macOS accessibility "Reduce motion" switch (GPUI does not read it); already in the tree
# through gpui_macos.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# The completion handler of the `.sql` open panel (`sql_picker.rs`); in the tree through GPUI.
block2 = "0.6"
# GPUI's NSView, for the window blur where GPUI's does not work (`glass.rs`); in the tree
# through GPUI.
raw-window-handle = "0.6"

[features]
# Window captures rendered in-process (`--demo` with DATAMAN_SHOT=file.png); test builds only.
screenshots = ["gpui/test-support", "gpui_platform/test-support", "dep:image"]
