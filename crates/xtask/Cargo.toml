[package]
name = "xtask"
description = "Dataman's release tooling (the app icon, the update signing key, DMG signatures) and the E2E runner"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
# Exactly the features GPUI builds: `default` alone would make Cargo build gpui and its platform
# crates twice, once for `cargo build -p dataman` and once for `cargo test --workspace`.
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
ring = "0.17"
data-encoding = "2"
