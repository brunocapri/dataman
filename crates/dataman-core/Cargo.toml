[package]
name = "dataman-core"
description = "Dataman without the UI: connections, execution, schema cache, autocomplete, history"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
tokio-postgres.workspace = true
postgres-protocol = "0.6"
futures-util.workspace = true
bytes = "1"
fallible-iterator = "0.2"
serde.workspace = true
# preserve_order: EXPLAIN's properties and imported JSON keep their order.
serde_json = { workspace = true, features = ["preserve_order"] }
toml.workspace = true
chrono = { workspace = true, features = ["serde"] }
parking_lot.workspace = true
uuid = { workspace = true, features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
# 0.14: the channel binding (SCRAM-SHA-256-PLUS) reads the certificate right; 0.13 never bound.
tokio-postgres-rustls = "0.14"
log = "0.4"
socket2 = "0.6"
regex = "1"
unicode-normalization = "0.1"
# Exact, and moved together: duckdb also depends on arrow 58, so arrow-data and the other arrow
# crates reach the tree through both; one pin keeps a single arrow version in Cargo.lock.
parquet = { version = "=58.4.1", default-features = false, features = ["arrow", "snap"] }
arrow-array = "=58.4.1"
arrow-schema = "=58.4.1"
# `ring` instead of the default aws-lc-rs.
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
ring = "0.17"
# The agent login's password for Elasticsearch and OpenSearch goes as a bcrypt hash, never in clear.
bcrypt = { version = "0.18", default-features = false, features = ["std"] }
semver = "1"
libc = "0.2"
# TLS through the same rustls on ring: no OpenSSL, no aws-lc.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
# Its TLS code names aws-lc-rs as the fallback provider, so that one is compiled in, but the
# process-wide provider (ring, installed before any connection) is the one it uses.
tiberius = { version = "0.13", default-features = false, features = ["tds80", "rustls", "sql-browser-tokio"] }
tokio-util = { version = "0.7", features = ["compat"] }
# TLS through rustls on ring: no OpenSSL, no aws-lc.
mongodb = { version = "3.9", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots-no-provider", "http2"] }
boa_engine = { version = "0.22", default-features = false }
# File databases, compiled in (no system library). No `load_extension`: SQL can't load code.
rusqlite = { version = "0.41", optional = true, features = ["bundled", "column_decltype", "column_metadata", "hooks", "limits"] }
# rusqlite's own (its statement batches iterate with it).
fallible-iterator-03 = { package = "fallible-iterator", version = "0.3", optional = true }
# DuckDB's C API through a table of pointers, as a loadable extension takes it: the engine itself
# (engines/duckdb, the C++ compiled with json and parquet) is a library loaded when a DuckDB
# database is first opened (backend/duck/engine.rs). Pinned: the engine is built from this
# libduckdb-sys, and backend/duck/api_v1.rs lists its API.
duckdb = { version = "=1.10506.1", optional = true, default-features = false, features = ["loadable-extension"] }
libloading = { version = "0.8", optional = true }

[features]
default = ["sqlite", "duckdb"]
sqlite = ["dep:rusqlite", "dep:fallible-iterator-03"]
duckdb = ["dep:duckdb", "dep:libloading"]

# Passwords: the Keychain on macOS, the Secret Service (GNOME Keyring, KWallet, KeePassXC) on
# Linux through oo7 with the features GPUI's Linux platform already builds.
[target.'cfg(target_os = "macos")'.dependencies]
# One generic password holds them all (secret/vault.rs): its attributes are read without the secret.
security-framework = "3"
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
futures-lite = "2"

# Passwords in the Credential Manager, the OS version from the registry, file stamps.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
# Certificates for the fake TLS servers, made as the tests start: no private key in the repository.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[target.'cfg(windows)'.dev-dependencies]
# The tests' resident memory, without `ps`.
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
