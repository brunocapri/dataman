[package]
name = "dataman-core"
description = "Dataman without the UI: connections, execution, schema cache, autocomplete, history"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-postgres.workspace = true
postgres-protocol = "0.6"
futures-util.workspace = true
bytes = "1"
fallible-iterator = "0.2"
serde.workspace = true
# preserve_order: EXPLAIN's properties and imported JSON keep their order.
serde_json = { workspace = true, features = ["preserve_order"] }
toml.workspace = true
chrono = { workspace = true, features = ["serde"] }
parking_lot.workspace = true
uuid = { workspace = true, features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio-postgres-rustls = "0.13"
log = "0.4"
socket2 = "0.6"
regex = "1"
unicode-normalization = "0.1"
parquet = { version = "=58.4.0", default-features = false, features = ["arrow", "snap"] }
arrow-array = "=58.4.0"
arrow-schema = "=58.4.0"
# `ring` instead of the default aws-lc-rs.
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
ring = "0.17"
semver = "1"
libc = "0.2"
# TLS through the same rustls on ring: no OpenSSL, no aws-lc.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
# Its TLS code names aws-lc-rs as the fallback provider, so that one is compiled in, but the
# process-wide provider (ring, installed before any connection) is the one it uses.
tiberius = { version = "0.13", default-features = false, features = ["tds80", "rustls", "sql-browser-tokio"] }
tokio-util = { version = "0.7", features = ["compat"] }
# TLS through rustls on ring: no OpenSSL, no aws-lc.
mongodb = { version = "3.9", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots-no-provider", "http2"] }
boa_engine = { version = "0.22", default-features = false }

# Passwords: the Keychain on macOS, the Secret Service (GNOME Keyring, KWallet, KeePassXC) on
# Linux through oo7 with the features GPUI's Linux platform already builds.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
futures-lite = "2"

[dev-dependencies]
tempfile = "3"
